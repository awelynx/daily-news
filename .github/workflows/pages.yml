# Builds site/ from news/data on the current main and deploys it to GitHub Pages.
# Called by daily.yml and fast.yml after they commit; also runs when site/ or the highlights change.
name: pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    # Site changes, and the daily highlights Joe pushes from the owner's Mac (~08:20 New York).
    paths: ["site/**", "news/data/highlights/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # include the commit the calling workflow just pushed
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
